# A curated set of OpenML tasks exercising real data-quality/data-type
# edge cases, used to verify E2E reliability beyond the tiny `test`
# benchmark's 3 clean datasets. Ported verbatim (task IDs, descriptions)
# from AMLB's resources/benchmarks/validation.yaml -- these are real,
# previously-known-tricky datasets (missing values formatted incorrectly,
# categorical labels with stray whitespace, boolean-like target classes
# that trip up pandas type coercion, a target column not in the last
# position, duplicate-differently-cased category labels), not invented
# for this project.
#
# `folds: 1` (not test.yaml's 2) via __defaults__ -- this benchmark's
# purpose is catching structural/type bugs across many distinct datasets,
# not statistically robust scores, so one fold per task is enough.
# max_runtime_seconds is intentionally left unset here (unlike test.yaml's
# __defaults__, which overrides it to 60s) so each task gets the full
# budget from whichever --constraint is passed on the CLI -- these
# datasets are meaningfully bigger than kc2/iris/cholesterol, and an
# artificially tight timeout would look like a reliability bug when it's
# really just an unfair budget.
---

- name: __defaults__
  folds: 1

- name: bioresponse
  openml_task_id: 9910
  description: |
    Binary, many features, all numericals.

- name: dresses-sales
  openml_task_id: 125920
  description: |
    Binary, mainly categorical features, with missing values in most categorical features.
    Also the Arff file contains a categorical feature with 2 labels for the same value (case sensitive).

- name: eucalyptus
  openml_task_id: 2079
  description: |
    Multiclass, mix of numerical and categorical features, with missing values in several numerical features.

- name: internet-advertisements
  openml_task_id: 167125
  description: |
    Binary, many features, almost all categorical but (0, 1), so can be interpreted as int.

- name: micro-mass
  openml_task_id: 9950
  description: |
    Multiclass, many features, all numericals.

- name: kc1
  openml_task_id: 3917
  description: |
    Binary with (true, false) as target classes.
    This causes issues if the framework is using Pandas when obtaining predictions:
      pandas will automatically convert ("true", "false") strings to (True, False) booleans which will then be reconverted to ("True", "False") when saved to csv.
      for those cases, Pandas should be avoided at that particular time or string type/conversion should be enforced for target predictions column.

- name: APSFailure
  openml_task_id: 168868
  description: |
    Dataset doesn't have its target as last column by default, and some framework may rely on this.

- name: diabetes130US
  openml_task_id: 168877
  description: |
    Missing values not formatted correctly.

- name: census-income
  openml_task_id: 211985
  description: |
    Many categoricals with labels starting/ending with spaces.
